openapi: 3.0.0
info:
  title: VISTRA_API_TESTS
  version: 1.0.0
  description: |-
    ### Welcome to Postman! This is your first collection. 

    Collections are your starting point for building and testing APIs. You can use this one to:

    • Group related requests
    • Test your API in real-world scenarios
    • Document and share your requests

    Update the name and overview whenever you’re ready to make it yours.

    [Learn more about Postman Collections.](https://learning.postman.com/docs/collections/collections-overview/)
servers:
  - url: '{{base_url}}'
paths:
  /staff/auth/login:
    post:
      summary: Login
      responses: {}
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
            example:
              email: '{{user_id}}'
              password: testpass123
  '/staff/{user_id}/':
    get:
      summary: Staff ID
      responses: {}
      tags:
        - Staff
      security:
        - BearerAuth: []
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
        example: '{{user_id}}'
  /staff//:
    get:
      summary: Staff ID - No ID
      responses: {}
      tags:
        - Staff
      security:
        - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
