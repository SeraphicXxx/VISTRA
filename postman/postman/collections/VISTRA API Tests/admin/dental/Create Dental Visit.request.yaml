$kind: http-request
url: "{{base_url}}/{{api_version}}/dental/"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: json
  content: "{\n    \"patient_id\": \"{{patient_id}}\",\n    \"visit_date\": \"2026-11-10\",\n    \"status\": \"Completed\",\n    \"type\": \"Consultation\",\n    \"staff_id\": \"{{staff_id}}\",\n    \"tooth_records\": [\n        {\n            \"tooth_number\": 11,\n            \"surface\": \"O\",\n            \"treatment\": \"Examination\"\n        }\n    ]\n}"
scripts:
  - type: beforeRequest
    code: "if (!pm.environment.get(\"patient_id\")) {\n    pm.environment.set(\"patient_id\", \"TEST-\" + Date.now());\n}\nif (!pm.environment.get(\"staff_id\")) {\n    pm.environment.set(\"staff_id\", \"STFT-\" + Date.now());\n}"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Create dental visit returns 200\", function () {\n    pm.response.to.have.status(200);\n});\n\npm.test(\"Response is JSON\", function () {\n    pm.response.to.be.json;\n});\n\nconst json = pm.response.json();\npm.test(\"Dental visit creation succeeds\", function () {\n    pm.expect(json.success).to.eql(true);\n    pm.expect(json).to.have.property(\"dental_record_id\");\n    pm.environment.set(\"dental_visit_id\", json.dental_record_id);\n});"
    language: text/javascript
order: 2000
