$kind: http-request
url: "{{base_url}}/{{api_version}}/dental/"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: json
  content: |-
    {
        "patient_id": "20230847-S",
        "last_dental_visit": "2026-10-10",
        "brushing_frequency": "twice_daily",
        "floss": true,
        "calculus_severity": "mild",
        "current_medications": "None",
        "notes": "Initial dental visit",
        "status": "Completed",
        "type": "Consultation",
        "staff_id": "{{staff_id}}",
        "tooth_records": [
            {
                "tooth_number": 11,
                "condition": "healthy",
                "dentition": "permanent",
                "notes": "No issues found"
            }
        ]
    }
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get("patient_id")) {
          pm.environment.set("patient_id", "TEST-" + Date.now());
      }
      if (!pm.environment.get("staff_id")) {
          pm.environment.set("staff_id", "STFT-" + Date.now());
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Create dental visit returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      const json = pm.response.json();
      console.log("Create dental full response:", JSON.stringify(json, null, 2));
      const recordId = json.dental_record_id || (json.data && json.data.dental_record_id);
      pm.test("Dental visit creation succeeds", function () {
          pm.expect(json.success).to.eql(true);
          pm.expect(recordId).to.not.be.undefined;
          pm.expect(recordId).to.not.be.null;
          pm.environment.set("dental_visit_id", recordId);
      });
    language: text/javascript
order: 2000
