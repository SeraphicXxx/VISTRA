$kind: http-request
url: "{{base_url}}/{{api_version}}/staff/{{staff_id}}/access"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: json
  content: "{\n    \"role\": \"staff\",\n    \"dental_module\": true,\n    \"medical_module\": true,\n    \"appointment_module\": true,\n    \"patient_module\": true,\n    \"staff_module\": true\n}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Update staff access returns 200\", function () {\n    pm.response.to.have.status(200);\n});\n\npm.test(\"Response is JSON\", function () {\n    pm.response.to.be.json;\n});\n\nconst json = pm.response.json();\npm.test(\"Permissions are updated\", function () {\n    pm.expect(json.success).to.eql(true);\n});"
    language: text/javascript
order: 800
