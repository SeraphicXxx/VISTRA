$kind: http-request
url: "{{base_url}}/{{api_version}}/auth/logout/"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Admin logout returns 200\", function () {\n    pm.response.to.have.status(200);\n});\n\npm.environment.unset(\"access_token\");\npm.environment.unset(\"refresh_token\");"
    language: text/javascript
order: 100
