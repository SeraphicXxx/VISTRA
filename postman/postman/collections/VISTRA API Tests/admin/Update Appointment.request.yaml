$kind: http-request
url: "{{base_url}}/{{api_version}}/appointments/{{appointment_id}}/"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: json
  content: "{\n    \"status\": \"Confirmed\",\n    \"notes\": \"Updated via Postman test\"\n}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Update appointment returns 200\", function () {\n    pm.response.to.have.status(200);\n});\n\npm.test(\"Response is JSON\", function () {\n    pm.response.to.be.json;\n});\n\nconst json = pm.response.json();\npm.test(\"Appointment is updated\", function () {\n    pm.expect(json.success).to.eql(true);\n});"
    language: text/javascript
order: 1800
