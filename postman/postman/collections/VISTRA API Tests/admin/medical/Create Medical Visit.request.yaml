$kind: http-request
url: "{{base_url}}/{{api_version}}/medical/"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: json
  content: |-
    {
        "patient_id": "{{patient_id}}",
        "status": "ongoingTreatment",
        "type": "medicalConsultation",
        "treatment_type": "Medicine",
        "visit_date": "2026-11-10T10:00:00Z",
        "complaint": "General checkup",
        "treatment": "Examination"
    }
scripts:
  - type: beforeRequest
    code: "if (!pm.environment.get(\"patient_id\")) {\n    pm.environment.set(\"patient_id\", \"TEST-\" + Date.now());\n}\nif (!pm.environment.get(\"staff_id\")) {\n    pm.environment.set(\"staff_id\", \"STFT-\" + Date.now());\n}"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Create medical visit returns 200\", function () {\n    pm.response.to.have.status(200);\n});\n\npm.test(\"Response is JSON\", function () {\n    pm.response.to.be.json;\n});\n\nconst json = pm.response.json();\npm.test(\"Medical visit creation succeeds\", function () {\n    pm.expect(json.success).to.eql(true);\n    pm.expect(json).to.have.property(\"medical_visit_id\");\n    pm.environment.set(\"medical_visit_id\", json.medical_visit_id);\n});"
    language: text/javascript
order: 2500
