$kind: http-request
url: "{{base_url}}/{{api_version}}/medical/"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: json
  content: |-
    {
        "patient_id": "20230847-S",
        "status": "ongoingTreatment",
        "type": "medicalConsultation",
        "treatment_type": "Medicine",
        "visit_date": "2026-11-10T10:00:00Z",
        "complaint": "General checkup",
        "treatment": "Examination"
    }
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get("patient_id")) {
          pm.environment.set("patient_id", "TEST-" + Date.now());
      }
      if (!pm.environment.get("staff_id")) {
          pm.environment.set("staff_id", "STFT-" + Date.now());
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Create medical visit returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      const json = pm.response.json();
      pm.test("Medical visit creation succeeds", function () {
          pm.expect(json.success).to.eql(true);
          pm.expect(json).to.have.property("medical_visit_id");
          pm.environment.set("medical_visit_id", json.medical_visit_id);
      });
    language: text/javascript
order: 2500
