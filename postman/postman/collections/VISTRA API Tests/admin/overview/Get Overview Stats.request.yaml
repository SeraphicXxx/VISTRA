$kind: http-request
url: "{{base_url}}/{{api_version}}/overview/"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Get overview stats returns 200\", function () {\n    pm.response.to.have.status(200);\n});\n\npm.test(\"Response is JSON\", function () {\n    pm.response.to.be.json;\n});\n\nconst json = pm.response.json();\npm.test(\"Overview stats are returned\", function () {\n    pm.expect(json.success).to.eql(true);\n    pm.expect(json.data).to.be.an(\"object\");\n    pm.expect(json.data).to.have.property(\"appointments_today\");\n    pm.expect(json.data).to.have.property(\"medical_today\");\n    pm.expect(json.data).to.have.property(\"dental_today\");\n});"
    language: text/javascript
order: 3000
