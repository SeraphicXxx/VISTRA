$kind: http-request
url: "{{base_url}}/{{api_version}}/patients/{{patient_id}}/"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{patientA_access_token}}"
scripts:
  - type: afterResponse
    code: |+
      pm.test("Patient reads own record: 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Own patient data is returned", function () {
          pm.expect(pm.response.json().success).to.eql(true);
      });
    language: text/javascript
order: 8050
