$kind: http-request
url: "{{base_url}}/{{api_version}}/auth/login/"
method: POST
body:
  type: json
  content: "{\r

    \    \"identifier\": \"{{patientB_id}}\",\r

    \    \"password\": \"TestPass123!\"\r

    }"
scripts:
  - type: afterResponse
    code: |+
      pm.test("Patient B login returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Patient B gets faculty role", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("access_token");
          pm.expect(jsonData.user.role).to.eql("faculty");
      });

      pm.environment.set("patientB_access_token", pm.response.json().access_token);
    language: text/javascript
order: 7970
