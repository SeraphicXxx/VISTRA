$kind: http-request
url: "{{base_url}}/{{api_version}}/appointments/"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{patientA_access_token}}"
body:
  type: json
  content: "{\r

    \    \"patient_id\": \"{{patient_id}}\",\r

    \    \"scheduled_start\": \"2026-12-02T11:00:00\",\r

    \    \"scheduled_end\": \"2026-12-02T12:00:00\",\r

    \    \"reason\": \"AuthZ own visit\",\r

    \    \"location\": \"Clinic A\"\r

    }"
scripts:
  - type: afterResponse
    code: |+
      pm.test("Patient creates own appointment: 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Own appointment succeeds", function () {
          pm.expect(pm.response.json().success).to.eql(true);
      });
    language: text/javascript
order: 8110
