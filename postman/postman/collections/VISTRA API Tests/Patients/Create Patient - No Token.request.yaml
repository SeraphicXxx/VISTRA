$kind: http-request
url: "{{base_url}}/{{api_version}}/patients/"
method: POST
auth:
  type: bearer
  credentials:
    token: ""
body:
  type: json
  content: "{\r

    \    \"patient_id\": \"TEST-{{$timestamp}}\",\r

    \    \"password\": \"TestPass123!\",\r

    \    \"created_by\": \"{{user_id}}\",\r

    \    \"name\": \"Test Patient\",\r

    \    \"address\": \"123 Test Street\",\r

    \    \"age\": {{patient_age}},\r

    \    \"barangay\": \"Commonwealth\",\r

    \    \"birthday\": \"{{patient_birthday}}\",\r

    \    \"mobile_number\": \"09171234567\",\r

    \    \"sex\": \"Male\",\r

    \    \"civil_status\": \"Single\",\r

    \    \"classification\": \"Student\"\r

    }"
scripts:
  - type: beforeRequest
    code: "const birthday = new Date();\r

      \r

      birthday.setFullYear(birthday.getFullYear() - 20);\r

      pm.environment.set(\"patient_birthday\", birthday.toISOString().slice(0, 10));\r

      pm.environment.set(\"patient_age\", \"20\");"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Unauthenticated request returns 401\", function () {\r

      \    pm.response.to.have.status(401);\r

      \    });"
    language: text/javascript
order: 7200
