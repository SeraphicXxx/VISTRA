$kind: http-request
url: "{{base_url}}/{{api_version}}/patients/{{patient_id}}/"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Get patient returns 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      \    });\r

      \r

      pm.test(\"Patient data is returned\", function () {\r

      \    const json = pm.response.json();\r

      \r

      \    pm.expect(json.success).to.eql(true);\r

      \    });"
    language: text/javascript
order: 7600
