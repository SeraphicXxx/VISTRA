$kind: http-request
url: "{{base_url}}/{{api_version}}/patients/"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: json
  content: "{\r

    \    \"patient_id\": \"{{patient_id}}\",\r

    \    \"password\": \"TestPass123!\",\r

    \    \"created_by\": \"{{user_id}}\",\r

    \    \"name\": \"Test, Patient\",\r

    \    \"address\": \"123 Test Street\",\r

    \    \"age\": 20,\r

    \    \"barangay\": \"Commonwealth\",\r

    \    \"birthday\": \"2006-07-07\",\r

    \    \"mobile_number\": \"09171234567\",\r

    \    \"sex\": \"Male\",\r

    \    \"civil_status\": \"Single\",\r

    \    \"classification\": \"Student\",\r

    \    \"course\": \"BS Computer Science\",\r

    \    \"school_year\": \"3rd Year\",\r

    \    \"section\": \"B\"\r

    }"
scripts:
  - type: beforeRequest
    code: "const stamp = Date.now();\r

      \r

      pm.environment.set(\"patient_id\", \"TEST-\" + stamp);\r

      \r

      const birthday = new Date();\r

      birthday.setFullYear(birthday.getFullYear() - 20);\r

      pm.environment.set(\"patient_birthday\", birthday.toISOString().slice(0, 10));\r

      pm.environment.set(\"patient_age\", \"20\");"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Create patient returns 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      \    });\r

      \r

      pm.test(\"Patient creation succeeds\", function () {\r

      \    const json = pm.response.json();\r

      \r

      \    pm.expect(json.success).to.eql(true);\r

      \    });"
    language: text/javascript
order: 7000
