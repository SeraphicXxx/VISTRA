$kind: http-request
url: "{{base_url}}/{{api_version}}/staff/"
method: POST
auth:
  type: bearer
  credentials:
    token: ""
body:
  type: json
  content: "{\r

    \    \"staff_id\": \"STFT-{{$timestamp}}\",\r

    \    \"first_name\": \"Test\",\r

    \    \"last_name\": \"Staff\",\r

    \    \"password\": \"TestPass123!\",\r

    \    \"position\": \"Nurse\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Unauthenticated request returns 401\", function () {\r

      \    pm.response.to.have.status(401);\r

      \    });"
    language: text/javascript
order: 5000
