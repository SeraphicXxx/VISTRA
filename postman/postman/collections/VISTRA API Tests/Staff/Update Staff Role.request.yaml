$kind: http-request
url: "{{base_url}}/{{api_version}}/staff/{{created_staff_id}}/role"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: json
  content: "{\r

    \    \"role\": \"Doctor\"\r

    }"
scripts:
  - type: afterResponse
    code: |+
      pm.test("Update role returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Updated role is echoed", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.eql(true);
          pm.expect(jsonData.data.role).to.eql("Doctor");
      });
    language: text/javascript
order: 6060
