$kind: http-request
url: "{{base_url}}/{{api_version}}/internal/emergency/clock-out-all"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |+
      pm.test("Emergency clock-out returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Clock-out reports flipped count", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData.count).to.be.a("number");
      });

      // NOTE: clears STAFF.is_active for everyone on duty. It runs
      // last inside the Staff folder; later folders never assert on
      // presence flags. Normal clearing is owned by the Postgres 5pm
      // cron; this is the manual emergency override.
    language: text/javascript
order: 6300
