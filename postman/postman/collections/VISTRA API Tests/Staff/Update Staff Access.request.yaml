$kind: http-request
url: "{{base_url}}/{{api_version}}/staff/{{created_staff_id}}/access"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: json
  content: "{\r

    \    \"role\": \"Doctor\",\r

    \    \"medical_module\": true,\r

    \    \"dental_module\": false,\r

    \    \"appointment_module\": true\r

    }"
scripts:
  - type: afterResponse
    code: |+
      pm.test("Update access returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Role and flags are echoed", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.eql(true);
          pm.expect(jsonData.data.role).to.eql("Doctor");
          pm.expect(jsonData.data.permissions.medical_module).to.eql(true);
          pm.expect(jsonData.data.permissions.dental_module).to.eql(false);
          pm.expect(jsonData.data.permissions.patient_module).to.eql(false);
      });
    language: text/javascript
order: 6050
