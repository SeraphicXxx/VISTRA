$kind: http-request
url: "{{base_url}}/staff/{{created_staff_id}}/"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Deleted staff returns 404\", function () {\r

      \    pm.response.to.have.status(404);\r

      \    });\r

      \r

      pm.test(\"Error detail is returned\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json).to.have.property(\"detail\");\r

      \    });"
    language: text/javascript
order: 6200
