$kind: http-request
url: "{{base_url}}/{{api_version}}/staff/"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: json
  content: "{\r

    \    \"staff_id\": \"{{created_staff_id}}\",\r

    \    \"first_name\": \"Test\",\r

    \    \"last_name\": \"Staff\",\r

    \    \"middle_name\": \"Q\",\r

    \    \"password\": \"TestPass123!\",\r

    \    \"position\": \"Nurse\",\r

    \    \"specialty\": \"General\",\r

    \    \"phone\": \"09170000000\",\r

    \    \"email\": \"test.staff@example.com\"\r

    }"
scripts:
  - type: beforeRequest
    code: pm.environment.set("created_staff_id", "STFT-" + Date.now());
    language: text/javascript
  - type: afterResponse
    code: "\r

      console.log(\"========================================\");\r

      console.log(\"CREATE STAFF DEBUG\");\r

      console.log(\"========================================\");\r

      \r

      console.log(\"Status code:\", pm.response.code);\r

      console.log(\"Status:\", pm.response.status);\r

      console.log(\"Response time:\", pm.response.responseTime);\r

      console.log(\"Response body:\");\r

      console.log(pm.response.text());\r

      \r

      console.log(\"========================================\");\r

      console.log(\"END CREATE STAFF DEBUG\");\r

      console.log(\"========================================\");\r

      \r

      \r

      pm.test(\"Create staff returns 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      \r

      pm.test(\"Staff creation succeeds\", function () {\r

      \    const body = pm.response.text();\r

      \r

      \    console.log(\"Raw body inside test:\");\r

      \    console.log(body);\r

      \r

      \    let json;\r

      \r

      \    try {\r

      \        json = JSON.parse(body);\r

      \    } catch (error) {\r

      \        console.log(\"JSON parsing failed:\");\r

      \        console.log(error);\r

      \r

      \        throw error;\r

      \    }\r

      \r

      \    console.log(\"Parsed JSON:\");\r

      \    console.log(JSON.stringify(json, null, 2));\r

      \r

      \    console.log(\"success value:\", json.success);\r

      \    console.log(\"message value:\", json.message);\r

      \r

      \    pm.expect(json.success).to.eql(true);\r

      });\r

      \r

      \r

      pm.test(\"Success message is returned\", function () {\r

      \    const body = pm.response.text();\r

      \r

      \    console.log(\"Checking message from:\");\r

      \    console.log(body);\r

      \r

      \    const json = JSON.parse(body);\r

      \r

      \    pm.expect(json).to.have.property(\"message\");\r

      });"
    language: text/javascript
order: 4000
