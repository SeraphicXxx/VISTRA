$kind: http-request
url: "{{base_url}}/{{api_version}}/staff/"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |+
      pm.test("Staff list returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Every row carries a permissions key", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.eql(true);
          pm.expect(jsonData.data).to.be.an("array");
          jsonData.data.forEach(function (row) {
              pm.expect(row).to.have.property("permissions");
          });
      });
    language: text/javascript
order: 3500
