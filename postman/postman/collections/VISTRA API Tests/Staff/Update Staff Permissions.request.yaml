$kind: http-request
url: "{{base_url}}/{{api_version}}/staff/{{created_staff_id}}/permissions"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: json
  content: "{\r

    \    \"medical_module\": true,\r

    \    \"dental_module\": false,\r

    \    \"appointment_module\": true\r

    }"
scripts:
  - type: afterResponse
    code: |+
      pm.test("Update permissions returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Partial flags are stored, rest untouched", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.eql(true);
          pm.expect(jsonData.data.medical_module).to.eql(true);
          pm.expect(jsonData.data.dental_module).to.eql(false);
          pm.expect(jsonData.data.patient_module).to.eql(false);
      });
    language: text/javascript
order: 6050
