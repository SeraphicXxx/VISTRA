$kind: http-request
url: "{{base_url}}/staff/{{user_id}}/"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Me returns 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"User information is returned\", function () {\r

      \    const json = pm.response.json();\r

      \r

      \    pm.expect(json.data).to.be.an(\"array\");\r

      \    pm.expect(json.data).to.have.lengthOf(1);\r

      \r

      \    pm.expect(json.data[0]).to.have.property(\"id\");\r

      \    pm.expect(json.data[0]).to.have.property(\"staff_id\");\r

      });"
    language: text/javascript
order: 1000
