$kind: http-request
url: "{{base_url}}/{{api_version}}/medical/999999999/"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Missing medical record returns 404\", function () {\r

      \    pm.response.to.have.status(404);\r

      \    });\r

      \r

      pm.test(\"Error detail is returned\", function () {\r

      \    const json = pm.response.json();\r

      \r

      \    pm.expect(json).to.have.property(\"detail\");\r

      \    });"
    language: text/javascript
order: 9650
