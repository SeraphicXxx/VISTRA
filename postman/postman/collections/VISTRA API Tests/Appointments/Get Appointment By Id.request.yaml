$kind: http-request
url: "{{base_url}}/{{api_version}}/appointments/20230847-S/{{appointment_id}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Get appointment returns 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      \    });\r

      \r

      pm.test(\"Appointment data is returned\", function () {\r

      \    const json = pm.response.json();\r

      \r

      \    pm.expect(json.success).to.eql(true);\r

      \    pm.expect(json.data).to.have.property(\"id\");\r

      \    });"
    language: text/javascript
order: 8300
