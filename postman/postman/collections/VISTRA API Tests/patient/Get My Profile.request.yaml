$kind: http-request
url: "{{base_url}}/{{api_version}}/patients/profiles/me/"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Get my profile returns 200\", function () {\n    pm.response.to.have.status(200);\n});\n\npm.test(\"Response is JSON\", function () {\n    pm.response.to.be.json;\n});\n\nconst json = pm.response.json();\npm.test(\"Profile data is returned\", function () {\n    pm.expect(json.success).to.eql(true);\n    pm.expect(json.data).to.be.an(\"object\");\n});"
    language: text/javascript
order: 500
