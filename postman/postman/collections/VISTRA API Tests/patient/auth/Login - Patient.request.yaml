$kind: http-request
url: "{{base_url}}/{{api_version}}/auth/login/"
method: POST
body:
  type: json
  content: "{\n    \"identifier\": \"{{user_id}}\",\n    \"password\": \"testpass123\"\n}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Patient login returns 200\", function () {\n    pm.response.to.have.status(200);\n});\n\npm.test(\"Response is JSON\", function () {\n    pm.response.to.be.json;\n});\n\nconst json = pm.response.json();\npm.test(\"Response contains access token\", function () {\n    pm.expect(json).to.have.property(\"access_token\");\n    pm.expect(json.access_token).to.be.a(\"string\");\n});\n\npm.test(\"User role is patient-type\", function () {\n    pm.expect(json.user).to.have.property(\"role\");\n});\n\npm.environment.set(\"access_token\", json.access_token);\npm.environment.set(\"refresh_token\", json.refresh_token);"
    language: text/javascript
order: 200
