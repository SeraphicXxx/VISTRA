$kind: http-request
url: "{{base_url}}/staff/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"{{user_id}}\",\r

    \    \"password\": \"tetspass123\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Invalid login returns 401\", function () {\r

      \    pm.response.to.have.status(401);\r

      });\r

      \r

      pm.test(\"Error message is returned\", function () {\r

      \    const json = pm.response.json();\r

      \r

      \    pm.expect(json).to.have.property(\"detail\");\r

      });"
    language: text/javascript
order: 2000
