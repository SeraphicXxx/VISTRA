$kind: http-request
url: "{{base_url}}/{{api_version}}/auth/logout/"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |+
      pm.test("Logout returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Logout reports success", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
      });

      // NOTE: logout revokes the session server-side (global sign-out).
      // It runs here, right after Refresh, while the access token is
      // fresh. Do not move it before other Auth requests.
    language: text/javascript
order: 3600
