$kind: http-request
url: "{{base_url}}/{{api_version}}/auth/login/"
method: POST
body:
  type: json
  content: "{\r

    \    \"identifier\": \"{{user_id}}\",\r

    \    \"password\": \"testpass123\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\" login (staff identifier) returns 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      \    });\r

      \r

      pm.test(\"Response is JSON\", function () {\r

      \    pm.response.to.be.json;\r

      \    });\r

      \r

      const json = pm.response.json();\r

      \r

      pm.test(\"Response contains access token and role\", function () {\r

      \    pm.expect(json).to.have.property(\"access_token\");\r

      \    pm.expect(json.access_token).to.be.a(\"string\");\r

      \    pm.expect(json.user).to.have.property(\"role\");\r

      \    });\r

      \r

      pm.environment.set(\r

      \    \"access_token\",\r

      \    json.access_token\r

      \    );\r

      \r

      pm.environment.set(\r

      \    \"refresh_token\",\r

      \    json.refresh_token\r

      \    );"
    language: text/javascript
order: 1500

