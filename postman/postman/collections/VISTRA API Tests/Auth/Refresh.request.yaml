$kind: http-request
url: "{{base_url}}/{{api_version}}/auth/refresh/"
method: POST
body:
  type: json
  content: "{\r

    \    \"refresh_token\": \"{{refresh_token}}\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\" refresh returns 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      \    });\r

      \r

      pm.test(\"New access token is returned\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json).to.have.property(\"access_token\");\r

      \    pm.expect(json.access_token).to.be.a(\"string\");\r

      \    });\r

      \r

      pm.environment.set(\r

      \    \"access_token\",\r

      \    pm.response.json().access_token\r

      \    );"
    language: text/javascript
order: 3500

