$kind: http-request
url: "{{base_url}}/staff/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"{{user_id}}\",\r

    \    \"password\": \"testpass123\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Login returns 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      const json = pm.response.json();\r

      \r

      pm.test(\"Response contains access token\", function () {\r

      \    pm.expect(json).to.have.property(\"access_token\");\r

      \    pm.expect(json.access_token).to.be.a(\"string\");\r

      });\r

      \r

      pm.environment.set(\r

      \    \"access_token\",\r

      \    json.access_token\r

      );"
    language: text/javascript
order: 1000
