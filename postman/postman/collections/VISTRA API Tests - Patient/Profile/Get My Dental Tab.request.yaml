$kind: http-request
url: "{{base_url}}/{{api_version}}/patients/record/dental-tab/"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Get my dental tab returns 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
        pm.response.to.be.json;
      });

      const json = pm.response.json();
      pm.test("Dental tab data is returned", function () {
        pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 700
