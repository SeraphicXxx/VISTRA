$kind: http-request
url: "{{base_url}}/{{api_version}}/medical/{{patient_id}}/{{medical_visit_id}}/"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
body:
  type: text
  content: |-
    {
        "status": "ongoingTreatment",
        "complaint": "Updated complaint",
        "treatment": "Updated treatment"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Update medical visit returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      const json = pm.response.json();
      pm.test("Medical visit is updated", function () {
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 4000
