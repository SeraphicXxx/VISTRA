$kind: http-request
url: "{{base_url}}/{{api_version}}/medical/{{medical_visit_id}}/"
method: DELETE
headers:
  Authorization: Bearer {{access_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Delete medical visit returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      const json = pm.response.json();
      pm.test("Medical visit deletion succeeds", function () {
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 5000
