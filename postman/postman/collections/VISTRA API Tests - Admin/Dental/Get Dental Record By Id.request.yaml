$kind: http-request
url: "{{base_url}}/{{api_version}}/dental/20230847-S/{{dental_visit_id}}"
method: GET
headers:
  Authorization: Bearer {{access_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Get dental record by id returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      const json = pm.response.json();
      pm.test("Dental record is returned", function () {
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 3000
