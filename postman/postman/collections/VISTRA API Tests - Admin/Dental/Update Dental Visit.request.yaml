$kind: http-request
url: "{{base_url}}/{{api_version}}/dental/{{patient_id}}/{{dental_visit_id}}/"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
body:
  type: text
  content: |-
    {
        "status": "ongoingTreatment",
        "tooth_records": [
            {
                "tooth_number": 11,
                "condition": "healthy",
                "notes": "No issues found"
            }
        ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Update dental visit returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      const json = pm.response.json();
      pm.test("Dental visit is updated", function () {
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 4000
