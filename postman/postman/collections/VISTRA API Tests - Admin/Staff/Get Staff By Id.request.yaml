$kind: http-request
url: "{{base_url}}/{{api_version}}/staff/{{staff_id}}/"
method: GET
headers:
  Authorization: Bearer {{access_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Get staff by id returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      const json = pm.response.json();
      pm.test("Staff record is returned", function () {
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data).to.have.property("staff_id");
      });
    language: text/javascript
order: 3000
