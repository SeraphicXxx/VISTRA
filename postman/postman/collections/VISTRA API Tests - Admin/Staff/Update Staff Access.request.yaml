$kind: http-request
url: "{{base_url}}/{{api_version}}/staff/{{staff_id}}/access"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
body:
  type: text
  content: |-
    {
        "role": "staff",
        "dental_module": true,
        "medical_module": true,
        "appointment_module": true,
        "patient_module": true,
        "staff_module": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Update staff access returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      const json = pm.response.json();
      pm.test("Permissions are updated", function () {
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 4000
