$kind: http-request
url: "{{base_url}}/{{api_version}}/patients/{{patient_id}}/"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
body:
  type: text
  content: |-
    {
        "barangay": "Commonwealth",
        "mobile_number": "09171234567",
        "complete_address": "123 Test Street"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Update patient profile returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      const json = pm.response.json();
      pm.test("Profile fields are updated", function () {
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.barangay).to.eql("Commonwealth");
          pm.expect(json.data.contact_no).to.eql("09171234567");
      });
    language: text/javascript
order: 16000
