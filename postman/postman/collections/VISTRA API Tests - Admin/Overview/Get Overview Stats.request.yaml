$kind: http-request
url: "{{base_url}}/{{api_version}}/overview/"
method: GET
headers:
  Authorization: Bearer {{access_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Get overview stats returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      const json = pm.response.json();
      pm.test("Overview stats are returned", function () {
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data).to.be.an("object");
          pm.expect(json.data).to.have.property("appointments_today");
          pm.expect(json.data).to.have.property("medical_today");
          pm.expect(json.data).to.have.property("dental_today");
      });
    language: text/javascript
order: 1000
