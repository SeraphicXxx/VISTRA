$kind: http-request
url: "{{base_url}}/{{api_version}}/patients/{{patient_id}}/"
method: GET
headers:
  Authorization: Bearer {{access_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Get patient by id returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      const json = pm.response.json();
      pm.test("Patient record is returned", function () {
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data).to.have.property("patient_id");
      });
    language: text/javascript
order: 15000
